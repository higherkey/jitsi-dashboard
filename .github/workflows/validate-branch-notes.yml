name: Validate Branch Notes Document

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  validate-notes:
    name: Check for Branch Notes Document
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for branch notes document
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "PR branch: $BRANCH"

          if echo "$BRANCH" | grep -qE '^(feat|fix|chore|refactor|docs|test|perf|build|ci|style)/'; then
            NORMALIZED_NAME=$(echo "$BRANCH" | sed 's/[/_ ]/-/g' | tr '[:upper:]' '[:lower:]')
            NOTES_PATH="docs/branch-notes/${NORMALIZED_NAME}-notes.md"
            echo "Expected branch notes: $NOTES_PATH"

            if [ -f "$NOTES_PATH" ]; then
              echo "Branch notes document found: $NOTES_PATH"
            else
              echo ""
              echo "MISSING BRANCH NOTES DOCUMENT"
              echo "Branch '$BRANCH' is a prefixed branch but no branch notes document was found."
              echo "Expected: $NOTES_PATH"
              echo ""
              echo "Create the branch notes document before merging this PR."
              exit 1
            fi
          else
            echo "Branch '$BRANCH' has no conventional prefix. Branch notes not required."
          fi
